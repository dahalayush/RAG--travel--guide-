version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: peru-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./audio:/app/audio
      - ./chroma_db:/app/chroma_db

    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: peru-frontend

    ports:
      - "5500:5500"

    depends_on:
      - backend